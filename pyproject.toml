[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "somem-framework"
version = "0.1.0"
description = "Self-organized document memory framework"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
benchmarks = ["datasets>=3,<5"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
somem = "somem.cli:main"
somem-benchmark = "somem.benchmark:main"

[project.urls]
Repository = "https://github.com/Qi202/SoMem"
Issues = "https://github.com/Qi202/SoMem/issues"
Documentation = "https://github.com/Qi202/SoMem/tree/main/docs"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
package-dir = { "" = "code" }

[tool.setuptools.packages.find]
where = ["code"]
include = ["somem*", "src*"]

[tool.setuptools.package-data]
somem = ["protocol_data/*.json", "evaluation_sources/*.py", "evaluation_sources/NOTICE.md", "evaluation_sources/pinned/*.py",
         "evaluation_sources/pinned/LICENSE", "evaluation_sources/pinned/NOTICE.md"]
