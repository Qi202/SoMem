[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "somem-framework"
version = "0.1.0"
description = "Self-organized document memory framework"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
somem = "somem.cli:main"

[project.optional-dependencies]
agents = [
    "anthropic>=0.40,<1",
    "claude-agent-sdk==0.1.81",
    "httpx[socks]>=0.27,<1",
    "openai>=1.50,<3",
]
embeddings = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements-core.txt"] }

[tool.setuptools]
package-dir = { "" = "code" }

[tool.setuptools.packages.find]
where = ["code"]
include = ["somem*", "src*"]
